name: Deploy Flowbox Application

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
        
    - name: Install dependencies
      run: |
        uv sync
        
    - name: Run tests (if any)
      run: |
        uv run python -m pytest tests/ || echo "No tests found"
        
    - name: Deploy to production
      if: github.ref == 'refs/heads/main'
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT || 22 }}
        script: |
          cd /opt/flowbox
          
          # Backup current version
          sudo cp -r /opt/flowbox /opt/flowbox.backup.$(date +%Y%m%d_%H%M%S)
          
          # Pull latest changes
          git pull origin main
          
          # Install/update dependencies
          uv sync
          
          # Ensure service files exist and are properly configured
          sudo systemctl daemon-reload
          
          # Restart the flowbox service
          sudo systemctl restart flowbox.service
          
          # Check if service is running
          sudo systemctl status flowbox.service
          
          # Check timer status
          sudo systemctl status flowbox.timer
          
          echo "Deployment completed successfully!"
          
    - name: Deploy to staging
      if: github.ref == 'refs/heads/develop'
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_USERNAME }}
        key: ${{ secrets.STAGING_SSH_KEY }}
        port: ${{ secrets.STAGING_PORT || 22 }}
        script: |
          cd /opt/flowbox-staging
          
          # Pull latest changes
          git pull origin develop
          
          # Install/update dependencies
          uv sync
          
          # Restart staging service
          sudo systemctl restart flowbox-staging.service
          
          echo "Staging deployment completed!"
          
    - name: Notify deployment
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment successful!"
        else
          echo "❌ Deployment failed!"
        fi
